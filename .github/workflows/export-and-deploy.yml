name: Export and Deploy ML Model

on:
  push:
    branches:
      - main

jobs:
  export-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install numpy pandas scikit-learn matplotlib seaborn joblib pyarrow wordcloud

      - name: Run export_model.py
        run: python scripts/export_model.py

      - name: Debug export result
        run: |
          echo "Contents of deploy/"
          ls -la deploy || echo "deploy/ not found"

      - name: Copy export result temporarily (before checkout)
        run: |
          mkdir -p tmp-ml_artifacts
          cp -r deploy/* tmp-ml_artifacts/

      - name: Switch to deploy branch
        run: |
          git fetch origin deploy || true
          git checkout -B deploy origin/deploy || git checkout -b deploy

      - name: Move copied files into ml_artifacts
        run: |
          rm -rf ml_artifacts
          mkdir -p ml_artifacts
          cp -r tmp-ml_artifacts/* ml_artifacts/

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add ml_artifacts
          git commit -m "Auto: export model and move to ml_artifacts" || echo "Nothing to commit"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}
          git push origin deploy
